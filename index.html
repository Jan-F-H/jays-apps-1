<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Test-App</title>
  <meta name="description" content="Einfacher Zähler als Test-PWA">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">

  <!-- iOS Home-Bildschirm / Vollbild -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Test-App">
  <meta name="format-detection" content="telephone=no">

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1 class="titel">Zähler</h1>

    <output id="zaehler" class="zaehler" aria-live="polite">0</output>

    <div class="steuerung">
      <button id="minus" class="btn btn-minus" type="button" aria-label="Eins abziehen">−</button>
      <button id="plus" class="btn btn-plus" type="button" aria-label="Eins hinzufügen">+</button>
    </div>

    <button id="reset" class="btn btn-reset" type="button">Zurücksetzen</button>
  </main>

  <script src="app.js"></script>
</body>
</html>
